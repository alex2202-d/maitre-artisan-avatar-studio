name: Generate Avatar Face Overlays

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/generate_face_overlays.py'
      - '.github/workflows/generate-avatar-faces.yml'
      - 'public/assets/avatar/v2/skins/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate UV-aligned face overlays
        run: python .github/scripts/generate_face_overlays.py
      - name: Commit generated face overlays
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/avatar/v2/faces
          if git diff --cached --quiet; then
            echo 'No generated face changes.'
            exit 0
          fi
          git commit -m 'assets: generate modular avatar face overlays'
          git pull --rebase origin main
          git push
