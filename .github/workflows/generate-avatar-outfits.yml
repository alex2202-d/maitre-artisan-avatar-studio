name: Generate Avatar Outfit Variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-avatar-outfits.yml'
      - '.github/scripts/generate_outfit_variants.py'
      - 'public/assets/avatar/v2/skins/*.glb'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate real rigged outfit GLBs
        run: python .github/scripts/generate_outfit_variants.py
      - name: Commit generated outfit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/avatar/v2/outfits
          if git diff --cached --quiet; then
            echo 'No generated outfit changes.'
            exit 0
          fi
          git commit -m 'assets: generate four rigged outfit variants'
          git pull --rebase origin main
          git push
