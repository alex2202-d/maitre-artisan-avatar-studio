name: Import generated avatar assets

on:
  push:
    paths:
      - "docs/FAL_ASSET_URLS_TEMP.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r target url; do
            [ -z "${target}" ] && continue
            case "${target}" in
              \#*) continue ;;
            esac
            mkdir -p "$(dirname "${target}")"
            echo "Downloading ${target}"
            curl -L --fail --retry 3 --retry-delay 2 "${url}" -o "${target}"
            test -s "${target}"
            case "${target}" in
              *.glb)
                test "$(head -c 4 "${target}")" = "glTF"
                ;;
            esac
          done < docs/FAL_ASSET_URLS_TEMP.txt

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/avatar/v1
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "assets: import avatar wardrobe v1"
          git push
